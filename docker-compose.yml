version: '3.8'

name: mspr_1_electioanalytics

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: electio-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-electio_analytics}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - electio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: electio-api
    environment:
      - ENV=${ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-electio_analytics}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
    ports:
      - "${API_PORT:-8002}:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electio-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Jupyter Lab pour l'analyse de données
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    container_name: electio-jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-electio_analytics}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electio-network
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  # Metabase - BI & Visualisation
  metabase:
    image: metabase/metabase:latest
    container_name: electio-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${DB_NAME:-electio_analytics}
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-postgres123}
      MB_DB_HOST: postgres
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electio-network
    restart: unless-stopped

  # Streamlit - Dashboard développement
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: electio-streamlit
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-electio_analytics}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config
      - ./streamlit_app:/app/streamlit_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electio-network
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0

networks:
  electio-network:
    driver: bridge
    name: electio-network

volumes:
  postgres_data:
    driver: local
  metabase_data:
    driver: local
